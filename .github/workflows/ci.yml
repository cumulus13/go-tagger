name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Unit tests: run on native OS runners ────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }} · Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:  [ ubuntu-latest, macos-latest, windows-latest ]
        go:  [ "1.21", "1.22" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Ensure go.sum exists
        run: '[ -f go.sum ] || touch go.sum'

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 -timeout 120s ./...

      - name: Build binary
        run: go build ./cmd/go-tagger

  # ── Cross-compilation smoke test ─────────────────────────────────────────────
  # Verifies that every release target actually compiles. No execution.
  cross-compile:
    name: Cross-compile · ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86
          - { label: "linux/amd64",     goos: linux,   goarch: amd64,   goarm: ""  }
          - { label: "linux/386",        goos: linux,   goarch: "386",   goarm: ""  }
          # Linux ARM (covers Android armv7 / armv6 / arm64)
          - { label: "linux/armv6",      goos: linux,   goarch: arm,     goarm: "6" }
          - { label: "linux/armv7",      goos: linux,   goarch: arm,     goarm: "7" }
          - { label: "linux/arm64",      goos: linux,   goarch: arm64,   goarm: ""  }
          # Linux MIPS
          - { label: "linux/mips",       goos: linux,   goarch: mips,    goarm: ""  }
          - { label: "linux/mipsle",     goos: linux,   goarch: mipsle,  goarm: ""  }
          - { label: "linux/mips64",     goos: linux,   goarch: mips64,  goarm: ""  }
          - { label: "linux/mips64le",   goos: linux,   goarch: mips64le,goarm: ""  }
          # Linux other
          - { label: "linux/ppc64le",    goos: linux,   goarch: ppc64le, goarm: ""  }
          - { label: "linux/riscv64",    goos: linux,   goarch: riscv64, goarm: ""  }
          - { label: "linux/s390x",      goos: linux,   goarch: s390x,   goarm: ""  }
          # macOS
          - { label: "darwin/amd64",     goos: darwin,  goarch: amd64,   goarm: ""  }
          - { label: "darwin/arm64",     goos: darwin,  goarch: arm64,   goarm: ""  }
          # Windows
          - { label: "windows/386",      goos: windows, goarch: "386",   goarm: ""  }
          - { label: "windows/amd64",    goos: windows, goarch: amd64,   goarm: ""  }
          - { label: "windows/arm64",    goos: windows, goarch: arm64,   goarm: ""  }
          # BSD
          - { label: "freebsd/amd64",    goos: freebsd, goarch: amd64,   goarm: ""  }
          - { label: "freebsd/arm64",    goos: freebsd, goarch: arm64,   goarm: ""  }
          - { label: "netbsd/amd64",     goos: netbsd,  goarch: amd64,   goarm: ""  }
          - { label: "openbsd/amd64",    goos: openbsd, goarch: amd64,   goarm: ""  }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Ensure go.sum exists
        run: '[ -f go.sum ] || touch go.sum'

      - name: Cross-compile
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /dev/null ./cmd/go-tagger
          echo "✓ ${{ matrix.label }}"

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ── Coverage ────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Run tests with coverage
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
